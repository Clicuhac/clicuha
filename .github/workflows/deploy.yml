name: Deploy to public_html (dry-run)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_HOST: ${{ secrets.DEPLOY_HOST }}
      RAW_USER: ${{ secrets.DEPLOY_USER }}
      RAW_PATH: ${{ secrets.DEPLOY_PATH }}
      RAW_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Prepare SSH config (skip known_hosts)
        run: |
          mkdir -p ~/.ssh
          printf "Host *\n    StrictHostKeyChecking no\n    UserKnownHostsFile=/dev/null\n" > ~/.ssh/config

      - name: Sanitize & validate SSH settings
        shell: bash
        run: |
          CLEAN_HOST="$(printf "%s" "$RAW_HOST" | tr -d '\r\n[:space:]')"
          CLEAN_USER="$(printf "%s" "$RAW_USER" | tr -d '\r\n[:space:]')"
          CLEAN_PATH="$(printf "%s" "$RAW_PATH" | tr -d '\r\n')"
          CLEAN_PORT="$(printf "%s" "${RAW_PORT:-22}" | tr -d '\r\n[:space:]')"

          echo "CLEAN_HOST=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "CLEAN_USER=$CLEAN_USER" >> "$GITHUB_ENV"
          echo "CLEAN_PATH=$CLEAN_PATH" >> "$GITHUB_ENV"
          echo "CLEAN_PORT=$CLEAN_PORT" >> "$GITHUB_ENV"

          echo "Using host: $CLEAN_HOST  port: $CLEAN_PORT"
          if [[ ! "$CLEAN_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Bad DEPLOY_HOST value (expect IPv4)."; exit 1; fi
          if [[ ! "$CLEAN_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Bad DEPLOY_USER value after sanitization."; exit 1; fi
          if [[ ! "$CLEAN_PORT" =~ ^[0-9]+$ ]]; then
            echo "Bad DEPLOY_PORT value."; exit 1; fi
          if [[ -z "$CLEAN_PATH" || "$CLEAN_PATH" != /* ]]; then
            echo "Bad DEPLOY_PATH value (expect absolute path)."; exit 1; fi

      - name: Quick SSH test
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -p "$CLEAN_PORT" \
            "$CLEAN_USER@$CLEAN_HOST" 'echo ssh-ok'

      - name: Rsync dry-run preview
        run: |
          rsync -azn --delete --itemize-changes -e "ssh -p $CLEAN_PORT" \
            --exclude ".git" --exclude ".github" --exclude "README.md" \
            --exclude ".env" --exclude "node_modules" --exclude "vendor" \
            ./ "$CLEAN_USER@$CLEAN_HOST:$CLEAN_PATH/"
